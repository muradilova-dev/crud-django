<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}CRUD{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 15px; }
        nav a { margin-right: 12px; }
        .item { padding: 8px 0; border-bottom: 1px solid #ddd; }
        .errorlist { color: #b00020; }
        .danger { color: #b00020; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'crud:list' %}">Список</a>
        <a href="{% url 'crud:create' %}">Добавить</a>
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
