<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Блог</title></head>
<body>
    <h1>Список статей</h1>
    {% for blog in blogs %}
        <div class="blog-item">
            <a href="{% url 'blog:detail' blog.pk %}">{{ blog.title }}</a>
        </div>
    {% empty %}
        <p>Статей пока нет.</p>
    {% endfor %}
</body>
</html>
